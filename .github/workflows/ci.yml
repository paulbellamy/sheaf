name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the root package.json `packageManager` field;
      # don't also pass `version` here or action-setup errors on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Typecheck both workspace packages (sheaf-server, sheaf-cli).
      - run: pnpm -r typecheck
      # Build the CLI bundle first: sheaf-cli's tests exec the built bin/sheaf.js.
      - run: pnpm --filter sheaf-cli build
      # Tests across the workspace (sheaf-server backend/MCP/app + sheaf-cli).
      - run: pnpm -r test
      # Smoke-test that the built CLI runs.
      - run: node sheaf-cli/bin/sheaf.js --version
